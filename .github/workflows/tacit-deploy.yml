name: Tacit deploy (AWS)

# Every push to main: check, build the Tacit web and api images, push them to ECR,
# then deploy them to the Dify EC2 host through SSM. Infrastructure and host
# scripts live in deploy/tacit-aws/; see "docs/Dify on AWS — Option A Plan.md".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tacit-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::107052598516:role/tacit-dify-github-deploy
  ECR_REGISTRY: 107052598516.dkr.ecr.eu-west-2.amazonaws.com
  RELEASE_BUCKET: tacit-dify-files-107052598516-eu-west-2
  INSTANCE_ID: i-09964dbc2f83b3c40
  DIFY_URL: https://35-176-83-203.sslip.io

jobs:
  check-web:
    name: Check web (lint, types, i18n)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: vp run lint:oxlint
      - run: vp run dify-web#type-check
      - run: vp run dify-web#i18n:check

  test-web:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - working-directory: web
        run: vp test run --project unit --silent=passed-only

  check-api:
    name: Check api (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - working-directory: api
        run: uv run --dev ruff check .

  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Skip when this commit's image already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "tacit-dify-${{ matrix.image }}" \
              --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.ECR_REGISTRY }}
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/tacit-dify-${{ matrix.image }}:${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=tacit-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=tacit-${{ matrix.image }}

  deploy:
    name: Deploy to EC2
    needs: [check-web, test-web, check-api, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload the release bundle (docker/ and deploy/tacit-aws/)
        run: |
          tar -czf release.tgz docker deploy/tacit-aws
          aws s3 cp release.tgz "s3://${RELEASE_BUCKET}/deploy/${GITHUB_SHA}/release.tgz" --only-show-errors
      - name: Run tacit-dify-deploy on the instance
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command --document-name tacit-dify-deploy \
            --instance-ids "$INSTANCE_ID" --parameters "Sha=${GITHUB_SHA}" \
            --timeout-seconds 600 --comment "deploy ${GITHUB_SHA::12}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 15
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 120
          echo "Status: $STATUS"
          [ "$STATUS" = Success ]
      - name: Verify from outside
        run: curl -fsS --retry 5 --retry-delay 10 "${DIFY_URL}/console/api/ping"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Tacit Dify deploy: ${{ job.status }}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DIFY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
