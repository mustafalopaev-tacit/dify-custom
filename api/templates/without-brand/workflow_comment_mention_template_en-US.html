<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      line-height: 16pt;
      color: #09090b;
      background-color: #e4e4e7;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 504px;
      min-height: 374px;
      margin: 40px auto;
      padding: 0 48px;
      background-color: #fcfcfd;
      border-radius: 16px;
      border: 1px solid #ffffff;
      box-shadow: 0px 3px 10px -2px rgba(9, 9, 11, 0.08), 0px 2px 4px -2px rgba(9, 9, 11, 0.06);
    }

    .header {
      padding-top: 36px;
      padding-bottom: 24px;
    }

    .header img {
      max-width: 120px;
      height: auto;
    }

    .title {
      margin: 0;
      padding-top: 8px;
      padding-bottom: 16px;
      color: #09090b;
      font-size: 24px;
      font-family: Inter;
      font-style: normal;
      font-weight: 600;
      line-height: 120%;
    }

    .description {
      color: #3f3f46;
      font-size: 14px;
      font-family: Inter;
      font-style: normal;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: -0.07px;
    }

    .content1 {
      margin: 0;
      padding-top: 16px;
      padding-bottom: 8px;
    }

    .content2 {
      margin: 0;
      padding-bottom: 16px;
    }

    .comment-box {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background-color: #f4f4f5;
    }

    .comment-text {
      margin: 0;
      color: #09090b;
      font-family: Inter;
      font-size: 14px;
      font-style: normal;
      font-weight: 500;
      line-height: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tips {
      margin: 0;
      padding-bottom: 24px;
      color: #3f3f46;
      font-size: 14px;
      font-family: Inter;
      font-style: normal;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: -0.07px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="{{ config.CONSOLE_WEB_URL }}/logo/logo-email.png" alt="Tacit" />
    </div>
    <p class="title">You were mentioned in a workflow comment</p>
    <div class="description">
      <p class="content1">Hi {{ mentioned_name }},</p>
      <p class="content2">{{ commenter_name }} mentioned you in {{ app_name }}.</p>
    </div>
    <div class="comment-box">
      <p class="comment-text">{{ comment_content }}</p>
    </div>
    <p class="tips"><a href="{{ app_url }}" style="color: #007957; text-decoration: none;">Open {{ application_title }}</a> to reply to the comment.</p>
  </div>
</body>

</html>
